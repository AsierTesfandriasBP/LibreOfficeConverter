version: "3.8"

services:
  libreoffice-converter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: libreoffice-converter
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - TZ=Europe/Berlin
    volumes:
      - libreoffice_convert_data:/data/convert
    networks:
      - n8n_shared
      - default

volumes:
  libreoffice_convert_data:

networks:
  n8n_shared:
    external: true
    name: n8n-dev-network
